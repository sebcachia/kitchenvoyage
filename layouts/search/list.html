{{ define "main" }}
  <section class="container search-results">
    <header class="section-header">
      <h1>{{ .Title }}</h1>
      {{ with .Content }}
        <div class="section-intro">
          {{ . }}
        </div>
      {{ end }}
      <p class="search-results__summary" data-search-summary>Type a keyword to find matching titles or tags.</p>
    </header>
    <form class="search-form" action="{{ "/search/" | relURL }}" method="get" data-search-page-form>
      <label class="sr-only" for="page-search-input">Search for stories</label>
      <div class="search-form__field">
        <input
          class="search-form__input"
          id="page-search-input"
          type="text"
          name="q"
          placeholder="Search recipes, travel guides, tags..."
          autocomplete="off"
          spellcheck="false"
          data-search-page-input>
        <button class="search-form__submit" type="submit">
          <span>Search</span>
        </button>
      </div>
    </form>
    <p class="search-status" data-search-status>Awaiting your first search...</p>
    <div class="post-grid" data-search-results>
      <p class="empty-state" data-search-empty>Start typing above to see results.</p>
    </div>
  </section>
{{ end }}
