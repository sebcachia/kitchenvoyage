baseURL = 'https://kitchenvoyage.com/'
languageCode = 'en-us'
title = 'KitchenVoyage'
theme = 'kitchenvoyage'

[outputs]
  home = ['HTML', 'JSON']

[pagination]
  pagerSize = 12

[params]
  highlightImageDefault = ''
  logo = '/images/logo-black.png'
  carouselInterval = 5000
  favicon = '/favicon.png'
  tagline = 'Journalling my voyage exploring new foods and places.'


  [params.author]
    name = 'Marica Cachia'

[taxonomies]
  category = 'categories'
  tag = 'tags'

[[menu.main]]
